name: Build containers

on:
  push:
    branches: [main]
    paths:
      - 'containers/diff-pdf*'
      - 'containers/build-latex*'
      - '.github/workflows/build-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [diff-pdf, build-latex]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/${{ matrix.image }}.Dockerfile
          push: true
          tags: ghcr.io/stamped-principles/${{ matrix.image }}:latest
